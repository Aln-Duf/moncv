<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title></title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">

<body>
    <form action="" , method="get" , name="formulaire">
        <fieldset>
            <legend>Informations personnelles</legend>
            <label for="name">Nom</label>
            <input type="text" name="name">
            <label for="firstname">Prénom</label>
            <input type="text" name="firstname">
            <br>
            <br>
            <label for="mail">Email</label>
            <input type="email" name="mail">
        </fieldset>
        <br>
        <fieldset>
            <legend>Compétences</legend>
            <label for="javascript">JavaScript</label>
            <input type="checkbox" , value="javascript" , name="javascript">
            <label for="php">PHP</label>
            <input type="checkbox" , value="php" , name="php">
            <label for="ruby">Ruby</label>
            <input type="checkbox" , value="ruby" , name="ruby">
            <label for="c#">C#</label>
            <input type="checkbox" , value="c#" , name="c#">
            <label for="react">React</label>
            <input type="checkbox" , value="react" , name="react">
            <label for="nodejs">Node.js</label>
            <input type="checkbox" , value="nodejs" , name="nodejs">
        </fieldset>
        <br>
        <br>
        <fieldset>
            <legend>Genre</legend>
            <label for="genre">Homme</label>
            <input type="radio" , name="genre" , value="homme">
            <label for="genre">Femme</label>
            <input type="radio" , name="genre" , value="femme">
            <label for="genre">Je ne suis pas encore certain</label>
            <input type="radio" , name="genre" , value="autre">
        </fieldset>
        <br>
        <br>
        <fieldset>
            <legend>Messages</legend>
            <input type="text" name="messages">
        </fieldset>
        <br>
        <br>
        <fieldset>
            <legend>Postes</legend>
            <select name="postes">
                <option value="choix">Choisissez un poste</option>
                <option value="dev">Développeur</option>
                <option value="intégrateur">intégrateur</option>
                <option value="concepteur">Concepteur</option>
            </select>
        </fieldset>
        <br>
        <br>
        <input type="submit" , value="Envoyer">
    </form>

    <script src="" async defer></script>
</body>

</html>
